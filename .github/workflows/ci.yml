name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          pip install -e .
      - name: Lint (ruff)
        run: ruff check . --output-format github --exit-zero
      - name: Compile check
        run: |
          python -m py_compile core/commands/__init__.py core/commands/patterns.py core/commands/steps.py
          python -m py_compile mcp_tool/pc/__init__.py mcp_tool/pc/common.py mcp_tool/pc/apps.py mcp_tool/pc/input.py mcp_tool/pc/files.py mcp_tool/pc/system.py
          python -m py_compile mcp_tool/__init__.py mcp_tool/workflow.py
      - name: Registry smoke
        env:
          COHERE_API_KEY: dummy
          GROQ_API_KEY: dummy
          OPENROUTER_API_KEY: dummy
          HUGGINGFACE_API_KEY: dummy
        run: python -c "import mcp_tool; assert len(mcp_tool.REGISTRY) >= 87, len(mcp_tool.REGISTRY)"
      - name: Tests
        shell: bash
        run: pytest -q || echo "no tests or tests skipped on CI"
